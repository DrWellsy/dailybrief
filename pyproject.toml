[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dailybrief"
version = "0.2.0"
description = "Your personal AI executive developer assistant in the terminal. Multi-LLM, 100% local Ollama, git-aware with chronic blocker detection."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "DrWellsy"}
]
keywords = [
    "ai",
    "agent",
    "cli",
    "terminal",
    "developer-tools",
    "productivity",
    "anthropic",
    "claude",
    "openai",
    "gemini",
    "ollama",
    "local-ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: Utilities",
]
dependencies = [
    "anthropic>=0.34.2",
    "click>=8.1.7",
    "rich>=13.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
dailybrief = "dailybrief.cli:main"

[project.urls]
Homepage = "https://github.com/DrWellsy/dailybrief"
Repository = "https://github.com/DrWellsy/dailybrief"
Issues = "https://github.com/DrWellsy/dailybrief/issues"

[tool.setuptools]
packages = ["dailybrief"]
